<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- db-g 应用图标：白色圆角底 + 细边，字母 G 用品牌渐变（蓝→青→靛，左上到右下）。
       位图由 `go run ./tools/genicon` 用同一几何生成：assets/icon-{256,512}.png -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F6FE4"/>
      <stop offset="50%" stop-color="#22B8E6"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <mask id="letter">
      <path fill="#fff" fill-rule="evenodd"
            d="M256 102a154 154 0 1 1 0 308a154 154 0 1 1 0-308
               M256 161a95 95 0 1 0 0 190a95 95 0 1 0 0-190"/>
      <rect x="308" y="174" width="200" height="164" fill="#000"/>
      <rect x="242" y="230" width="148" height="52" fill="#fff"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="102" fill="#FFFFFF" stroke="#C8D6EC" stroke-width="8"/>
  <rect width="512" height="512" rx="102" fill="url(#g)" mask="url(#letter)"/>
</svg>
